[project]
name = "font-subset"
version = "0.1.0"
description = "从思源黑体裁剪 3500 常用字子集，供 Godot 小游戏使用"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.67.0",
]

[project.scripts]
font-subset = "font_subset.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
